name: Build Windows EXE

# Jalan otomatis setiap kali ada push ke branch main,
# dan bisa juga dipicu manual dari tab "Actions" di GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE dengan PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name KMLI `
            --add-data "database/db_kmli.db;database" `
            main.py

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: KMLI-windows-exe
          path: dist/KMLI.exe
